name: Build APK

# Hanya saat ada PR yang di-merge ke main. Bukan `push`: main juga menerima
# edit langsung lewat web GitHub (README dsb.) yang tidak perlu APK baru.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write   # gh release create

jobs:
  build:
    # `closed` juga terpicu oleh PR yang ditutup tanpa merge.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # Saat merge, GITHUB_SHA masih commit uji-merge GitHub, bukan commit
          # yang benar-benar masuk main (beda untuk squash/rebase merge).
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk henshin-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" henshin-${{ github.run_number }}.apk \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "Henshin build #${{ github.run_number }}" \
            --prerelease --generate-notes
