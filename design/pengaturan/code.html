<script>
  function triggerRipple(event, element) {
    const rect = element.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    
    const ripple = document.createElement('div');
    ripple.className = 'absolute bg-primary/10 rounded-full scale-0 pointer-events-none transition-transform duration-500 ease-out';
    ripple.style.width = ripple.style.height = Math.max(rect.width, rect.height) * 2 + 'px';
    ripple.style.left = x - Math.max(rect.width, rect.height) + 'px';
    ripple.style.top = y - Math.max(rect.width, rect.height) + 'px';
    
    element.appendChild(ripple);
    
    requestAnimationFrame(() => {
      ripple.classList.remove('scale-0');
      ripple.classList.add('scale-100', 'opacity-0');
    });
    
    setTimeout(() => {
      ripple.remove();
    }, 500);

    // Subtle scale effect simulating physical press
    element.style.transform = 'scale(0.98)';
    element.style.transition = 'transform 0.1s cubic-bezier(0.4, 0, 0.2, 1)';
    setTimeout(() => {
       element.style.transform = 'scale(1)';
    }, 150);
  }
