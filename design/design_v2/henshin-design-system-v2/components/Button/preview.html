<!doctype html>
<html lang="id">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="hs-frame">
  <div class="hs-col" style="width:320px">
    <button class="hs-btn hs-btn-primary hs-btn-block">Bayar Rp 54.000</button>
    <div style="display:flex;gap:8px">
      <button class="hs-btn" style="flex:1">Batal</button>
      <button class="hs-btn hs-btn-danger" style="flex:1">Void transaksi</button>
    </div>
  </div>
  <div class="hs-col" style="width:320px">
    <button class="hs-btn hs-btn-primary hs-btn-block" disabled>Uang kurang Rp 4.000</button>
    <button class="hs-btn hs-btn-primary hs-btn-block is-pressed"><span class="hs-spin"></span>Menyimpan</button>
    <div><button class="hs-btn hs-btn-ghost">Lihat semua</button></div>
  </div>
</div>
</body>
</html>
