<!-- @dsCard height=288 -->
<!doctype html>
<html lang="id">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<meta charset="utf-8">
<title>Henshin</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--primary); }
  .deep { fill:var(--ink); }
  .tint { fill:var(--primary-soft); }
  .warn { fill:var(--warning-soft); }
  .paper { fill:var(--surface); }
  .line-p { fill:var(--primary); }
  .line-i { fill:var(--ink-muted); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:104px; line-height:.92; font-weight:700; letter-spacing:-2px; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      primary 160×264 slab bled off the top (the one action colour, largest) · ink 128×184 (deep) · primary-soft 136×120 (tint) bled right · warning-soft 64×48 once (only ever "stok menipis") — ≈40% of the right half
  arrangement one tall teal slab with satellites, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     literal motif, the struk: "Satu model Receipt" — receipt rows as space-2-tall pills at a space-4 pitch, cut into the slab in surface, a short total row in primary on the tint
  scales      sides in space-2 multiples; gutters space-4; pitch space-4; corners radius-md, pills rx 4 (half of space-2)
-->
<rect class="brand" x="16" y="-24" width="160" height="288" rx="12"/>
<rect class="deep" x="192" y="80" width="128" height="184" rx="12"/>
<rect class="tint" x="336" y="144" width="160" height="120" rx="12"/>
<rect class="warn" x="336" y="80" width="64" height="48" rx="12"/>
<!-- struk rows cut into the slab -->
<rect class="paper" x="40" y="40" width="80" height="8" rx="4"/>
<rect class="paper" x="40" y="72" width="112" height="8" rx="4"/>
<rect class="paper" x="40" y="88" width="56" height="8" rx="4"/>
<rect class="paper" x="112" y="88" width="40" height="8" rx="4"/>
<rect class="paper" x="40" y="120" width="96" height="8" rx="4"/>
<rect class="paper" x="40" y="136" width="48" height="8" rx="4"/>
<rect class="paper" x="112" y="136" width="40" height="8" rx="4"/>
<rect class="paper" x="40" y="168" width="104" height="8" rx="4"/>
<rect class="paper" x="40" y="184" width="56" height="8" rx="4"/>
<rect class="paper" x="112" y="184" width="40" height="8" rx="4"/>
<rect class="paper" x="40" y="224" width="112" height="16" rx="8"/>
<!-- the total, on the tint -->
<rect class="line-p" x="360" y="176" width="56" height="8" rx="4"/>
<rect class="line-p" x="360" y="200" width="112" height="24" rx="12"/>
</svg>
</div>
<div class="words">
<h1 class="name">Henshin</h1>
<p class="tag">Kasir offline untuk satu warung, satu HP, satu pemegang.</p>
</div>
</div>
</body>
</html>
