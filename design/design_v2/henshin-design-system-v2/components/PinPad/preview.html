<!doctype html>
<html lang="id">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>PinPad</title></head>
<body>
<div class="hs-frame">
  <div class="hs-pin">
    <div style="font-size:17px;line-height:24px;font-weight:600">Masukkan PIN untuk void</div>
    <div class="hs-dots"><span class="hs-dot on"></span><span class="hs-dot on"></span><span class="hs-dot on"></span><span class="hs-dot"></span><span class="hs-dot"></span><span class="hs-dot"></span></div>
    <div class="hs-keys">
      <button class="hs-key">1</button><button class="hs-key">2</button><button class="hs-key">3</button>
      <button class="hs-key">4</button><button class="hs-key">5</button><button class="hs-key">6</button>
      <button class="hs-key">7</button><button class="hs-key">8</button><button class="hs-key">9</button>
      <span class="hs-key blank"></span><button class="hs-key">0</button><button class="hs-key" aria-label="Hapus digit" style="display:flex;align-items:center;justify-content:center"><svg class="hs-ic" viewBox="0 0 24 24"><path d="M9 6h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5-6z"/><path d="M12 10l4 4M16 10l-4 4"/></svg></button>
    </div>
  </div>
  <div class="hs-pin" style="align-self:flex-start">
    <div style="font-size:17px;line-height:24px;font-weight:600">Masukkan PIN untuk void</div>
    <div class="hs-dots is-error"><span class="hs-dot"></span><span class="hs-dot"></span><span class="hs-dot"></span><span class="hs-dot"></span><span class="hs-dot"></span><span class="hs-dot"></span></div>
    <span class="hs-help is-error">PIN salah. Coba lagi.</span>
  </div>
</div>
</body>
</html>
