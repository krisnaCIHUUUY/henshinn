<!-- @dsCard group="Input" height=250 subtitle="search + scan · money · fokus · error" -->
<!doctype html>
<html lang="id">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Field</title></head>
<body>
<div class="hs-frame">
  <div class="hs-col" style="width:328px">
    <div class="hs-field">
      <div style="display:flex;gap:8px">
        <div class="hs-input grow" style="flex:1">
          <svg class="hs-ic" viewBox="0 0 24 24" style="color:var(--ink-muted)"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
          <span class="ph">Cari nama produk</span>
        </div>
        <button class="hs-icon-btn" aria-label="Scan barcode"><svg class="hs-ic" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 9v6M11 9v6M14 9v6M17 9v6"/></svg></button>
      </div>
    </div>
    <div class="hs-field">
      <span class="hs-field-label">Uang diterima</span>
      <div class="hs-input is-focus hs-num"><span class="pre">Rp</span><span class="grow" style="font-weight:600">60.000</span></div>
      <span class="hs-help">Kembalian Rp 6.000</span>
    </div>
  </div>
  <div class="hs-col" style="width:328px">
    <div class="hs-field">
      <span class="hs-field-label">Nama produk</span>
      <div class="hs-input"><span class="grow">Kopi Susu Henshin</span></div>
    </div>
    <div class="hs-field">
      <span class="hs-field-label">Harga jual</span>
      <div class="hs-input is-error hs-num"><span class="pre">Rp</span><span class="grow">12.000</span></div>
      <span class="hs-help is-error">Harga jual harus lebih dari harga modal (Rp 14.000)</span>
    </div>
  </div>
</div>
</body>
</html>
