<!doctype html>
<html lang="id">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>CartRow</title></head>
<body>
<div style="padding:16px 0">
<div class="hs-phone hs-list">
  <div class="hs-row is-new">
    <div class="hs-row-main"><span class="hs-row-name">Kopi Susu Henshin</span><span class="hs-row-sub hs-num">Rp 18.000 × 2</span></div>
    <div class="hs-row-end">
      <span class="hs-row-price">Rp 36.000</span>
      <div class="hs-stepper"><button class="hs-step" aria-label="Kurangi">−</button><span class="hs-qty">2</span><button class="hs-step" aria-label="Tambah">+</button></div>
    </div>
  </div>
  <div class="hs-row">
    <div class="hs-row-main"><span class="hs-row-name">Roti Coklat</span><span class="hs-row-sub hs-num">Rp 6.000 × 1</span></div>
    <div class="hs-row-end">
      <span class="hs-row-price">Rp 6.000</span>
      <div class="hs-stepper"><button class="hs-step is-del" aria-label="Hapus dari keranjang"><svg class="hs-ic" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button><span class="hs-qty">1</span><button class="hs-step" aria-label="Tambah">+</button></div>
    </div>
  </div>
  <div class="hs-row">
    <div class="hs-row-main"><span class="hs-row-name">Indomie Goreng</span><span class="hs-row-sub" style="color:var(--warning)">Stok tinggal 3</span></div>
    <div class="hs-row-end">
      <span class="hs-row-price">Rp 10.500</span>
      <div class="hs-stepper"><button class="hs-step" aria-label="Kurangi">−</button><span class="hs-qty">3</span><button class="hs-step" disabled style="color:var(--line-strong)" aria-label="Tambah">+</button></div>
    </div>
  </div>
</div>
</div>
</body>
</html>
