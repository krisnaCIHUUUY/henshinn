<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--bg:#f4f6f6;--surface:#ffffff;--surface-muted:#eaeff0;--line:#dde4e4;--line-strong:#8a9697;--ink:#172021;--ink-muted:#5b6768;--primary:#006565;--primary-pressed:#004d4d;--primary-soft:#ddf0ef;--on-primary:#ffffff;--success:#1d6b37;--success-soft:#e2f2e7;--warning:#7a4f00;--warning-soft:#fcefd2;--danger:#b3261e;--danger-soft:#fbe3e0;--shadow-sheet:0 -4px 24px rgba(23,32,33,0.12);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-full:999px;--tap-min:48px;--tap-primary:56px;--row-min:64px;--font-sans:Roboto, "Noto Sans", system-ui, sans-serif;--font-mono:"Roboto Mono", ui-monospace, monospace;--text-amount:700 36px/44px var(--font-sans);--text-stat:700 22px/28px var(--font-sans);--text-title:600 22px/28px var(--font-sans);--text-heading:600 17px/24px var(--font-sans);--text-body:400 16px/24px var(--font-sans);--text-body-strong:600 16px/24px var(--font-sans);--text-label:500 14px/20px var(--font-sans);--text-caption:500 12px/16px var(--font-sans);--text-receipt:400 13px/18px var(--font-mono);}}</style>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Riwayat</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#172021}a:hover{color:#172021}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #f4f6f6; font-family: Roboto, 'Noto Sans', system-ui, sans-serif; color: #172021; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px 16px">
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">Riwayat</h1>
    <button type="button" aria-label="Cari transaksi" style="width: 48px; height: 48px; margin: -10px -12px -10px 0; border: 0; background: transparent; color: #5b6768; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
    </button>
  </header>

  <div style="display: flex; gap: 8px; padding: 8px 16px 0 16px; overflow: hidden">
    <button type="button" aria-pressed="true" style="flex: none; height: 40px; padding: 0 16px; border: 1px solid #006565; border-radius: 999px; background: #ddf0ef; color: #006565; font: inherit; font-size: 14px; font-weight: 500">Hari ini</button>
    <button type="button" style="flex: none; height: 40px; padding: 0 16px; border: 1px solid #8a9697; border-radius: 999px; background: #ffffff; color: #172021; font: inherit; font-size: 14px; font-weight: 500">Kemarin</button>
    <button type="button" style="flex: none; height: 40px; padding: 0 16px; border: 1px solid #8a9697; border-radius: 999px; background: #ffffff; color: #172021; font: inherit; font-size: 14px; font-weight: 500">7 hari</button>
    <button type="button" style="flex: none; height: 40px; padding: 0 16px; border: 1px solid #8a9697; border-radius: 999px; background: #ffffff; color: #172021; font: inherit; font-size: 14px; font-weight: 500">Pilih tanggal</button>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 16px 16px 8px 16px">
    <h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 600">Hari ini · 24 transaksi</h2>
    <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #5b6768">1 void</span>
  </div>

  <div style="margin: 0 16px; background: #ffffff; border: 1px solid #dde4e4; border-radius: 12px; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <a href="Void.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 12px 8px 16px; border-bottom: 1px solid #dde4e4; text-decoration: none; color: #172021">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; line-height: 22px; font-variant-numeric: tabular-nums">{{r.id}} · {{r.time}}</span>
          <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #5b6768">{{r.summary}}</span>
        </span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
          <sc-if value="{{r.void}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 16px; line-height: 22px; font-weight: 600; color: #5b6768; text-decoration: line-through; font-variant-numeric: tabular-nums">{{r.total}}</span>
            <span style="padding: 2px 8px; border-radius: 8px; background: #fbe3e0; color: #b3261e; font-size: 12px; line-height: 16px; font-weight: 600">Void</span>
          </sc-if>
          <sc-if value="{{r.done}}" hint-placeholder-val="{{true}}">
            <span style="font-size: 16px; line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums">{{r.total}}</span>
            <span style="padding: 2px 8px; border-radius: 8px; background: #e2f2e7; color: #1d6b37; font-size: 12px; line-height: 16px; font-weight: 600">Selesai</span>
          </sc-if>
        </span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b6768" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Navigasi utama" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #ffffff; border-top: 1px solid #dde4e4; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5b6768; font-size: 12px; line-height: 16px; font-weight: 500">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3" width="14" height="6" rx="1"></rect><path d="M3 21h18l-1.5-9h-15z"></path><path d="M8 15h2M14 15h2M8 18h8"></path></svg></span>Kasir</a>
    <a href="Produk.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5b6768; font-size: 12px; line-height: 16px; font-weight: 500">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"></path><path d="M3 7l9 4 9-4M12 11v10"></path></svg></span>Produk</a>
    <a href="Riwayat.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #006565; font-size: 12px; line-height: 16px; font-weight: 600">
      <span style="width: 56px; height: 32px; border-radius: 999px; background: #ddf0ef; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6M9 16h4"></path></svg></span>Riwayat</a>
    <a href="Laporan.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5b6768; font-size: 12px; line-height: 16px; font-weight: 500">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-7"></path></svg></span>Laporan</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { id: '#0142', time: '14.32', summary: '3 produk · Tunai', total: 'Rp 23.500', v: false },
      { id: '#0141', time: '14.05', summary: '1 produk · Tunai', total: 'Rp 72.000', v: false },
      { id: '#0140', time: '13.48', summary: '4 produk · Tunai', total: 'Rp 31.000', v: false },
      { id: '#0139', time: '13.20', summary: '2 produk · Salah input', total: 'Rp 9.500', v: true },
      { id: '#0138', time: '12.57', summary: '5 produk · Tunai', total: 'Rp 46.500', v: false },
      { id: '#0137', time: '12.11', summary: '2 produk · Tunai', total: 'Rp 8.000', v: false },
      { id: '#0136', time: '11.40', summary: '1 produk · Tunai', total: 'Rp 18.000', v: false },
      { id: '#0135', time: '11.02', summary: '3 produk · Tunai', total: 'Rp 14.500', v: false }
    ];
    return { rows: rows.map((r) => ({ ...r, void: r.v, done: !r.v })) };
  }
}
</script>
</body>
</html>
