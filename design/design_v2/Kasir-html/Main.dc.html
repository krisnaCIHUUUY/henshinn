<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--bg:#f4f6f6;--surface:#ffffff;--surface-muted:#eaeff0;--line:#dde4e4;--line-strong:#8a9697;--ink:#172021;--ink-muted:#5b6768;--primary:#006565;--primary-pressed:#004d4d;--primary-soft:#ddf0ef;--on-primary:#ffffff;--success:#1d6b37;--success-soft:#e2f2e7;--warning:#7a4f00;--warning-soft:#fcefd2;--danger:#b3261e;--danger-soft:#fbe3e0;--shadow-sheet:0 -4px 24px rgba(23,32,33,0.12);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-full:999px;--tap-min:48px;--tap-primary:56px;--row-min:64px;--font-sans:Roboto, "Noto Sans", system-ui, sans-serif;--font-mono:"Roboto Mono", ui-monospace, monospace;--text-amount:700 36px/44px var(--font-sans);--text-stat:700 22px/28px var(--font-sans);--text-title:600 22px/28px var(--font-sans);--text-heading:600 17px/24px var(--font-sans);--text-body:400 16px/24px var(--font-sans);--text-body-strong:600 16px/24px var(--font-sans);--text-label:500 14px/20px var(--font-sans);--text-caption:500 12px/16px var(--font-sans);--text-receipt:400 13px/18px var(--font-mono);}}</style>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kasir</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#006565}a:hover{color:#004d4d}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #f4f6f6; font-family: Roboto, 'Noto Sans', system-ui, sans-serif; color: #172021; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px 16px">
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">Kasir</h1>
    <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #5b6768">Hari ini, 14.32</span>
  </header>

  <div style="display: flex; gap: 8px; padding: 8px 16px 0 16px">
    <label style="flex: 1; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; box-sizing: border-box; background: #ffffff; border: 1px solid #8a9697; border-radius: 12px; color: #5b6768">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Cari produk</span>
      <input type="search" placeholder="Cari produk atau barcode" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px; color: #172021">
    </label>
    <button type="button" aria-label="Scan barcode" style="width: 48px; height: 48px; border: 0; border-radius: 12px; background: #eaeff0; color: #172021; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"></path></svg>
    </button>
  </div>

  <div style="display: flex; gap: 8px; padding: 12px 16px 0 16px; overflow: hidden">
    <button type="button" aria-pressed="true" style="flex: none; height: 40px; padding: 0 16px; border: 1px solid #006565; border-radius: 999px; background: #ddf0ef; color: #006565; font: inherit; font-size: 14px; font-weight: 500">Semua</button>
    <button type="button" style="flex: none; height: 40px; padding: 0 16px; border: 1px solid #8a9697; border-radius: 999px; background: #ffffff; color: #172021; font: inherit; font-size: 14px; font-weight: 500">Makanan</button>
    <button type="button" style="flex: none; height: 40px; padding: 0 16px; border: 1px solid #8a9697; border-radius: 999px; background: #ffffff; color: #172021; font: inherit; font-size: 14px; font-weight: 500">Minuman</button>
    <button type="button" style="flex: none; height: 40px; padding: 0 16px; border: 1px solid #8a9697; border-radius: 999px; background: #ffffff; color: #172021; font: inherit; font-size: 14px; font-weight: 500">Sembako</button>
  </div>

  <section style="padding: 16px 16px 0 16px">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 32px">
      <h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 600">Keranjang · 3 produk</h2>
      <button type="button" style="height: 32px; padding: 0 8px; border: 0; background: transparent; color: #5b6768; font: inherit; font-size: 14px; font-weight: 500">Kosongkan</button>
    </div>
    <div style="margin-top: 8px; background: #ffffff; border: 1px solid #dde4e4; border-radius: 12px; overflow: hidden">
      <sc-for list="{{cart}}" as="item" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 8px 8px 12px; border-bottom: 1px solid #dde4e4; background: {{item.bg}}">
          <span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 8px; background: #eaeff0; color: #5b6768; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">{{item.initial}}</span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.name}}</span>
            <span style="font-size: 16px; line-height: 22px; font-weight: 600; color: #006565; font-variant-numeric: tabular-nums">{{item.subtotal}}</span>
          </div>
          <div style="flex: none; display: flex; align-items: center; gap: 0">
            <button type="button" aria-label="Kurangi" style="width: 44px; height: 48px; border: 0; border-radius: 8px; background: #eaeff0; color: #172021; display: flex; align-items: center; justify-content: center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
            </button>
            <span style="width: 36px; text-align: center; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums">{{item.qty}}</span>
            <button type="button" aria-label="Tambah" style="width: 44px; height: 48px; border: 0; border-radius: 8px; background: #eaeff0; color: #172021; display: flex; align-items: center; justify-content: center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="padding: 24px 16px 0 16px">
    <h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 600">Sering dibeli</h2>
    <div style="margin-top: 8px; background: #ffffff; border: 1px solid #dde4e4; border-radius: 12px; overflow: hidden">
      <sc-for list="{{quick}}" as="p" hint-placeholder-count="2">
        <button type="button" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 12px; border: 0; border-bottom: 1px solid #dde4e4; background: #ffffff; font: inherit; color: #172021; text-align: left">
          <span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 8px; background: #eaeff0; color: #5b6768; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">{{p.initial}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; line-height: 22px">{{p.name}}</span>
            <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #5b6768">{{p.meta}}</span>
          </span>
          <span style="font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums">{{p.price}}</span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#006565" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </sc-for>
    </div>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 72px; display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: #ffffff; box-shadow: 0 -4px 24px rgba(23,32,33,0.12)">
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #5b6768">Total · 8 pcs</span>
      <span style="font-size: 36px; line-height: 44px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums">Rp 23.500</span>
    </div>
    <a href="Bayar.dc.html" style="flex: none; width: 148px; height: 56px; border-radius: 12px; background: #006565; color: #ffffff; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 17px; font-weight: 600">Bayar</a>
  </div>

  <nav aria-label="Navigasi utama" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #ffffff; border-top: 1px solid #dde4e4; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #006565; font-size: 12px; line-height: 16px; font-weight: 600">
      <span style="width: 56px; height: 32px; border-radius: 999px; background: #ddf0ef; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3" width="14" height="6" rx="1"></rect><path d="M3 21h18l-1.5-9h-15z"></path><path d="M8 15h2M14 15h2M8 18h8"></path></svg></span>Kasir</a>
    <a href="Produk.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5b6768; font-size: 12px; line-height: 16px; font-weight: 500">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"></path><path d="M3 7l9 4 9-4M12 11v10"></path></svg></span>Produk</a>
    <a href="Riwayat.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5b6768; font-size: 12px; line-height: 16px; font-weight: 500">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6M9 16h4"></path></svg></span>Riwayat</a>
    <a href="Laporan.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5b6768; font-size: 12px; line-height: 16px; font-weight: 500">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-7"></path></svg></span>Laporan</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cart: [
        { initial: 'M', name: 'Mi Goreng Instan', subtotal: 'Rp 7.000', qty: 2, bg: '#ffffff' },
        { initial: 'A', name: 'Air Mineral 600 ml', subtotal: 'Rp 4.000', qty: 1, bg: '#ffffff' },
        { initial: 'T', name: 'Telur Ayam (butir)', subtotal: 'Rp 12.500', qty: 5, bg: '#ddf0ef' }
      ],
      quick: [
        { initial: 'K', name: 'Kopi Sachet', meta: 'Minuman · Stok 64', price: 'Rp 2.000' },
        { initial: 'G', name: 'Gula Pasir 1 kg', meta: 'Sembako · Stok 12', price: 'Rp 18.000' }
      ]
    };
  }
}
</script>
</body>
</html>
