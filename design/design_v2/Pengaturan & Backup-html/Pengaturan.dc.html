<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--bg:#f4f6f6;--surface:#ffffff;--surface-muted:#eaeff0;--line:#dde4e4;--line-strong:#8a9697;--ink:#172021;--ink-muted:#5b6768;--primary:#006565;--primary-pressed:#004d4d;--primary-soft:#ddf0ef;--on-primary:#ffffff;--success:#1d6b37;--success-soft:#e2f2e7;--warning:#7a4f00;--warning-soft:#fcefd2;--danger:#b3261e;--danger-soft:#fbe3e0;--shadow-sheet:0 -4px 24px rgba(23,32,33,0.12);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-full:999px;--tap-min:48px;--tap-primary:56px;--row-min:64px;--font-sans:Roboto, "Noto Sans", system-ui, sans-serif;--font-mono:"Roboto Mono", ui-monospace, monospace;--text-amount:700 36px/44px var(--font-sans);--text-stat:700 22px/28px var(--font-sans);--text-title:600 22px/28px var(--font-sans);--text-heading:600 17px/24px var(--font-sans);--text-body:400 16px/24px var(--font-sans);--text-body-strong:600 16px/24px var(--font-sans);--text-label:500 14px/20px var(--font-sans);--text-caption:500 12px/16px var(--font-sans);--text-receipt:400 13px/18px var(--font-mono);}}</style>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pengaturan dan backup</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#006565}a:hover{color:#004d4d}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #f4f6f6; font-family: Roboto, 'Noto Sans', system-ui, sans-serif; color: #172021; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 4px">
    <a href="Laporan.dc.html" aria-label="Kembali ke laporan" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #172021">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">Pengaturan</h1>
  </header>

  <div style="display: flex; flex-direction: column; gap: 24px; padding: 8px 16px 0 16px">
    <div role="status" style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; background: #fcefd2; border-radius: 12px; color: #7a4f00">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.5"></path></svg>
      <span style="display: flex; flex-direction: column">
        <span style="font-size: 16px; line-height: 22px; font-weight: 600">Backup terakhir 8 hari lalu</span>
        <span style="font-size: 14px; line-height: 20px; font-weight: 500">Buat backup sekarang supaya data toko aman kalau HP rusak atau hilang.</span>
      </span>
    </div>

    <section>
      <h2 style="margin: 0 0 8px 0; font-size: 17px; line-height: 24px; font-weight: 600">Backup &amp; restore</h2>
      <div style="background: #ffffff; border: 1px solid #dde4e4; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; gap: 12px">
          <span style="display: flex; flex-direction: column">
            <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #5b6768">Backup terakhir</span>
            <span style="font-size: 16px; line-height: 24px; font-weight: 600">30 Okt, 21.15</span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end">
            <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #5b6768">Isi</span>
            <span style="font-size: 16px; line-height: 24px; font-weight: 600">86 produk · 1.912 transaksi</span>
          </span>
        </div>
        <button type="button" style="height: 56px; border: 0; border-radius: 12px; background: #006565; color: #ffffff; font: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.5-8 6 6 0 0 1 11.5 1.5A3.5 3.5 0 0 1 17.5 18"></path><path d="M12 12v7M9 15l3-3 3 3"></path></svg>Buat backup</button>
        <button type="button" style="height: 48px; border: 0; border-radius: 12px; background: #eaeff0; color: #172021; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6"></path><path d="M4 4v4.6h4.6"></path><path d="M12 8v4l3 2"></path></svg>Restore dari backup</button>
        <p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; color: #5b6768">Restore butuh PIN dan mengganti semua data di HP ini dengan isi file backup.</p>
      </div>
    </section>

    <section>
      <h2 style="margin: 0 0 8px 0; font-size: 17px; line-height: 24px; font-weight: 600">Toko</h2>
      <div style="background: #ffffff; border: 1px solid #dde4e4; border-radius: 12px; overflow: hidden">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
          <button type="button" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 12px 8px 16px; border: 0; border-bottom: 1px solid #dde4e4; background: #ffffff; font: inherit; color: #172021; text-align: left">
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 16px; line-height: 22px">{{r.title}}</span>
              <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #5b6768">{{r.sub}}</span>
            </span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b6768" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </sc-for>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { title: 'Info toko', sub: 'Nama dan alamat di struk' },
        { title: 'Printer struk', sub: 'Bluetooth 58 mm · terhubung' },
        { title: 'Ubah PIN pemilik', sub: 'Untuk void, restore, harga, dan laba' }
      ]
    };
  }
}
</script>
</body>
</html>
