<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--bg:#f4f6f6;--surface:#ffffff;--surface-muted:#eaeff0;--line:#dde4e4;--line-strong:#8a9697;--ink:#172021;--ink-muted:#5b6768;--primary:#006565;--primary-pressed:#004d4d;--primary-soft:#ddf0ef;--on-primary:#ffffff;--success:#1d6b37;--success-soft:#e2f2e7;--warning:#7a4f00;--warning-soft:#fcefd2;--danger:#b3261e;--danger-soft:#fbe3e0;--shadow-sheet:0 -4px 24px rgba(23,32,33,0.12);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-full:999px;--tap-min:48px;--tap-primary:56px;--row-min:64px;--font-sans:Roboto, "Noto Sans", system-ui, sans-serif;--font-mono:"Roboto Mono", ui-monospace, monospace;--text-amount:700 36px/44px var(--font-sans);--text-stat:700 22px/28px var(--font-sans);--text-title:600 22px/28px var(--font-sans);--text-heading:600 17px/24px var(--font-sans);--text-body:400 16px/24px var(--font-sans);--text-body-strong:600 16px/24px var(--font-sans);--text-label:500 14px/20px var(--font-sans);--text-caption:500 12px/16px var(--font-sans);--text-receipt:400 13px/18px var(--font-mono);}}</style>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pembayaran</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#006565}a:hover{color:#004d4d}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #f4f6f6; font-family: Roboto, 'Noto Sans', system-ui, sans-serif; color: #172021; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 4px">
    <a href="Main.dc.html" aria-label="Kembali ke kasir" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #172021">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">Pembayaran</h1>
  </header>

  <div style="display: flex; flex-direction: column; gap: 24px; padding: 8px 16px 0 16px">
    <div style="background: #ffffff; border: 1px solid #dde4e4; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #5b6768">Total belanja · 3 produk, 8 pcs</span>
      <span style="font-size: 36px; line-height: 44px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums">Rp 23.500</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="cash" style="font-size: 14px; line-height: 20px; font-weight: 500; color: #172021">Uang diterima (tunai)</label>
      <div style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px; box-sizing: border-box; background: #ffffff; border: 2px solid #006565; border-radius: 12px">
        <span style="font-size: 17px; font-weight: 600; color: #5b6768">Rp</span>
        <input id="cash" inputmode="numeric" value="50.000" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 22px; font-weight: 700; color: #172021; font-variant-numeric: tabular-nums">
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 48px; border: 1px solid #8a9697; border-radius: 999px; background: #ffffff; color: #172021; font: inherit; font-size: 14px; font-weight: 500">Uang pas</button>
        <button type="button" style="height: 48px; border: 1px solid #8a9697; border-radius: 999px; background: #ffffff; color: #172021; font: inherit; font-size: 14px; font-weight: 500">25.000</button>
        <button type="button" aria-pressed="true" style="height: 48px; border: 1px solid #006565; border-radius: 999px; background: #ddf0ef; color: #006565; font: inherit; font-size: 14px; font-weight: 600">50.000</button>
        <button type="button" style="height: 48px; border: 1px solid #8a9697; border-radius: 999px; background: #ffffff; color: #172021; font: inherit; font-size: 14px; font-weight: 500">100.000</button>
      </div>
    </div>

    <div style="background: #e2f2e7; border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 16px; line-height: 24px; font-weight: 600; color: #1d6b37">Kembalian</span>
      <span style="font-size: 22px; line-height: 28px; font-weight: 700; color: #1d6b37; font-variant-numeric: tabular-nums">Rp 26.500</span>
    </div>

    <section>
      <h2 style="margin: 0 0 8px 0; font-size: 17px; line-height: 24px; font-weight: 600">Rincian</h2>
      <div style="background: #ffffff; border: 1px solid #dde4e4; border-radius: 12px; padding: 4px 16px">
        <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; border-bottom: 1px solid #dde4e4">
            <span style="display: flex; flex-direction: column">
              <span style="font-size: 16px; line-height: 22px">{{l.name}}</span>
              <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #5b6768; font-variant-numeric: tabular-nums">{{l.calc}}</span>
            </span>
            <span style="font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums">{{l.sub}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 16px 16px; background: #ffffff; box-shadow: 0 -4px 24px rgba(23,32,33,0.12)">
    <a href="Struk.dc.html" style="height: 56px; border-radius: 12px; background: #006565; color: #ffffff; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 17px; font-weight: 600">Selesaikan transaksi</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      lines: [
        { name: 'Mi Goreng Instan', calc: '2 × Rp 3.500', sub: 'Rp 7.000' },
        { name: 'Air Mineral 600 ml', calc: '1 × Rp 4.000', sub: 'Rp 4.000' },
        { name: 'Telur Ayam (butir)', calc: '5 × Rp 2.500', sub: 'Rp 12.500' }
      ]
    };
  }
}
</script>
</body>
</html>
